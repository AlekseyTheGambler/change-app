<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WallpaperChanger.App &mdash; Switch Your Wallpaper Instantly</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0d0d14;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      top: -30%;
      left: -20%;
      width: 70%;
      height: 70%;
      background: radial-gradient(ellipse, rgba(255, 100, 80, 0.18) 0%, transparent 70%);
      pointer-events: none;
      animation: driftA 12s ease-in-out infinite alternate;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -30%;
      right: -20%;
      width: 70%;
      height: 70%;
      background: radial-gradient(ellipse, rgba(80, 60, 200, 0.22) 0%, transparent 70%);
      pointer-events: none;
      animation: driftB 14s ease-in-out infinite alternate;
    }

    @keyframes driftA {
      from { transform: translate(0, 0); }
      to   { transform: translate(6%, 8%); }
    }

    @keyframes driftB {
      from { transform: translate(0, 0); }
      to   { transform: translate(-6%, -8%); }
    }

    .card {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 60px 48px 52px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 32px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      max-width: 460px;
      width: 90vw;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04),
        0 32px 80px rgba(0, 0, 0, 0.5);
    }

    .logo-wrap {
      display: inline-block;
      margin-bottom: 32px;
      filter: drop-shadow(0 12px 40px rgba(255, 100, 80, 0.35))
              drop-shadow(0 4px 16px rgba(80, 60, 200, 0.35));
      animation: float 5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-10px); }
    }

    .logo-wrap img {
      width: 130px;
      height: 130px;
      border-radius: 28px;
      display: block;
    }

    h1 {
      font-size: clamp(1.3rem, 5vw, 1.75rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      white-space: nowrap;
      background: linear-gradient(135deg, #ff8c6b 0%, #c46fff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }

    .tagline {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.5);
      line-height: 1.6;
      font-weight: 300;
      margin-bottom: 36px;
    }

    .tagline strong {
      color: rgba(255, 255, 255, 0.75);
      font-weight: 600;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 40px;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      color: #fff;
      background: linear-gradient(135deg, #ff6b4a 0%, #7c4dff 100%);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
      box-shadow: 0 8px 32px rgba(255, 107, 74, 0.35), 0 2px 8px rgba(0,0,0,0.3);
      letter-spacing: 0.01em;
    }

    .download-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 16px 48px rgba(255, 107, 74, 0.45), 0 4px 16px rgba(0,0,0,0.4);
    }

    .download-btn:active {
      transform: translateY(0) scale(0.98);
      opacity: 0.9;
    }

    .download-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .note {
      margin-top: 20px;
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.28);
      line-height: 1.5;
    }

    .windows-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 18px;
      font-size: 0.75rem;
      font-weight: 500;
      color: rgba(255,255,255,0.3);
    }

    .windows-badge svg {
      width: 14px;
      height: 14px;
      opacity: 0.4;
    }
  </style>
</head>
<body>
  <div class="card">

    <div class="logo-wrap">
      <img src="logo.png" alt="WallpaperChanger.App Logo" />
    </div>

    <h1>WallpaperChanger.App</h1>

    <p class="tagline">
      Switch your Windows wallpaper in seconds.<br />
      <strong>Pick once. Number it. Change instantly.</strong>
    </p>

    <a class="download-btn" href="WallpaperChanger.zip" download>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Download for Windows
    </a>

    <div class="windows-badge">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M0 3.449L9.75 2.1v9.451H0m10.949-9.602L24 0v11.4H10.949M0 12.6h9.75v9.451L0 20.699M10.949 12.6H24V24l-13.051-1.8"/>
      </svg>
      Windows 10 / 11 &nbsp;&middot;&nbsp; Free &nbsp;&middot;&nbsp; v1.0
    </div>

    <p class="note">
      Windows Defender may show a warning on first run &mdash; this is normal for unsigned apps.<br />
      Click <em>"More info &rarr; Run anyway"</em> to continue safely.
    </p>

  </div>
</body>
</html>
